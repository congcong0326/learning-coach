name: learning-coach-prod

services:
  postgres:
    image: postgres:16
    container_name: learning-coach-prod-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learning_coach}
      POSTGRES_USER: ${POSTGRES_USER:-learning_coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learning_coach}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-learning_coach} -d ${POSTGRES_DB:-learning_coach}",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    container_name: learning-coach-prod-backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+asyncpg://learning_coach:learning_coach@postgres:5432/learning_coach}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_ID: ${LLM_MODEL_ID:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      target: runtime
    container_name: learning-coach-prod-frontend
    ports:
      - "${FRONTEND_HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
